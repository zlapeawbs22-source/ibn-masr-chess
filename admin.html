
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحكم ابن مصر 👑</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{font-family:'Cairo';background:#0e0e0e;color:#fff;padding:15px}h1{color:#81b64c}.card{background:#262421;padding:12px;border-radius:10px;margin:8px 0;border-right:4px solid #81b64c}.room{font-family:monospace;direction:ltr;background:#161512;padding:6px;border-radius:6px;margin:4px 0;color:#81b64c;word-break:break-all;font-size:11px}button{background:#81b64c;color:#fff;border:none;padding:7px 12px;border-radius:6px;font-family:'Cairo';cursor:pointer;margin:2px;font-size:11px}button.ghost{background:#8a2be2}button.close{background:#ff4444}button.ban{background:#000;border:1px solid #ff4444;color:#ff4444}#log{max-height:300px;overflow-y:auto;background:#161512;padding:8px;border-radius:8px;font-size:11px}.online{color:#81b64c}</style></head><body><h1>👑 تحكم ابن مصر - شبح + قفل + حظر</h1><div class="card"><span id="dot">●</span> <span id="st">بيتصل...</span><br><small>سيب الصفحة دي مفتوحة طول ما انت عايز تراقب</small></div><div class="card">غرف: <b id="count">0</b> | حركات: <b id="moves">0</b> <button onclick="clearRooms()">مسح الكل</button></div><div class="card"><h3>🎮 الغرف النشطة</h3><div id="rooms"><p style="color:#777">مفيش غرف لسه... أول ما حد يعمل غرفة هتظهر هنا</p></div></div><div class="card"><h3>📜 السجل</h3><div id="log"></div></div><script>
let rooms=[],moveCount=0,peer;function log(t){let d=document.createElement('div');d.style.padding='3px';d.style.borderBottom='1px solid #222';d.textContent=new Date().toLocaleTimeString('ar-EG')+' - '+t;document.getElementById('log').prepend(d)}function render(){document.getElementById('count').textContent=rooms.length;document.getElementById('moves').textContent=moveCount;let box=document.getElementById('rooms');if(!rooms.length){box.innerHTML='<p style="color:#777">مفيش غرف</p>';return}box.innerHTML='';rooms.forEach((r,i)=>{let div=document.createElement('div');div.className='card';div.style.margin='5px 0';div.innerHTML=`<b>${r.room}</b><div class="room">${r.link}</div><small>🕐 ${r.time}</small><br><button class="ghost" onclick="ghostWatch('${r.room}')">👻 شبح - مخفي</button><button onclick="watchRoom('${r.room}')" style="background:#ff9500">👁️ عادي</button><button class="close" onclick="closeRoom('${r.room}')">🔒 إقفال الغرفة</button><button class="ban" onclick="banRoom('${r.room}')">🚫 حظر</button><button onclick="copyRoom('${r.room}')" style="background:#3d3a37">نسخ اللينك</button><button onclick="delRoom(${i})" style="background:#333">X</button>`;box.appendChild(div)})}function ghostWatch(id){window.open('https://zlapeawbs22-source.github.io/ibn-masr-chess/?watch='+id+'&ghost=1','_blank');log('👻 دخلت شبح في: '+id)}function watchRoom(id){window.open('https://zlapeawbs22-source.github.io/ibn-masr-chess/?join='+id,'_blank');log('👁️ دخول عادي: '+id)}function copyRoom(id){navigator.clipboard.writeText('https://zlapeawbs22-source.github.io/ibn-masr-chess/?join='+id);alert('تم النسخ!')}function delRoom(i){rooms.splice(i,1);render();log('حذف غرفة')}function clearRooms(){rooms=[];moveCount=0;render();document.getElementById('log').innerHTML='';log('مسح الكل')}function sendAdminCmd(roomId,action){let p=new Peer();p.on('open',()=>{let c=p.connect(roomId);c.on('open',()=>{c.send({type:'admin',action:action,from:'ibn-masr-admin'});log((action=='ban'?'🚫 حظر ':'🔒 إغلاق ')+roomId);setTimeout(()=>{p.destroy();rooms=rooms.filter(r=>r.room!=roomId);render()},1200)})});c&&c.on&&c.on('error',()=>{log('⚠️ الغرفة مش متاحة دلوقتي: '+roomId)})}
function closeRoom(id){if(confirm('تقفل غرفة '+id+' ؟ هتتقفل في وش اللاعبين!'))sendAdminCmd(id,'close')}
function banRoom(id){if(confirm('تحظر صاحب الغرفة '+id+' ؟ مش هيعرف يدخل الموقع تاني من جهازه!'))sendAdminCmd(id,'ban')}
function initAdmin(){peer=new Peer('ibn-masr-admin');peer.on('open',()=>{document.getElementById('st').textContent='متصل ✅ - جاهز تراقب وتقفل وتحظر';document.getElementById('st').style.color='#81b64c';document.getElementById('dot').style.color='#81b64c';log('✅ لوحة التحكم اشتغلت - ID: ibn-masr-admin')});peer.on('connection',conn=>{conn.on('data',data=>{if(data.type=='newRoom'){if(!rooms.find(r=>r.room==data.room)){rooms.unshift(data);render();log('🎮 غرفة جديدة: '+data.room)}}else if(data.type=='move'){moveCount++;document.getElementById('moves').textContent=moveCount;log('♟️ حركة في: '+data.room)}})});peer.on('disconnected',()=>{document.getElementById('dot').style.color='#ff4444';document.getElementById('st').textContent='انقطع - بيعيد الاتصال...';peer.reconnect()})}initAdmin();
</script></body></html>

<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ابن مصر للشطرنج - عالمي أونلاين</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo',Tahoma;background:radial-gradient(circle at top,#1e293b,#020617);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}h1{color:#fbbf24;font-weight:800;font-size:26px;margin:8px} .layout{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%;max-width:950px} .card{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:16px;width:min(94vw,460px);box-shadow:0 10px 30px rgba(0,0,0,.5)} #board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(92vw,460px);height:min(92vw,460px);aspect-ratio:1/1;border:6px solid #0f172a;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px #fbbf24,0 20px 50px rgba(0,0,0,.6)} .cell{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;user-select:none;position:relative;cursor:pointer} .light{background:#f0d9b5}.dark{background:#b58863} .white-piece{color:#ffffff !important;-webkit-text-stroke:1.3px #000000;text-shadow:0 1px 0 #000,0 2px 3px rgba(0,0,0,.8);font-weight:900;filter:drop-shadow(0 1px 1px #000)} .black-piece{color:#000000 !important;-webkit-text-stroke:.7px #ffffff;text-shadow:0 0 2px #fff;font-weight:900} .sel{outline:4px solid #facc15;outline-offset:-4px;z-index:5} .dot::after{content:'';width:24%;height:24%;background:#22c55e;border-radius:50%;position:absolute;box-shadow:0 0 8px #22c55e} .cap{box-shadow:inset 0 0 0 5px #ef4444 !important} #status{background:#0f172a;border:1px solid #fbbf24;padding:8px 16px;border-radius:100px;font-weight:700;margin-bottom:8px} button{background:#334155;color:#fff;border:none;padding:10px 16px;border-radius:12px;font-family:'Cairo';font-weight:700;cursor:pointer} button.primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000} input{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;font-family:'Cairo';direction:ltr;text-align:center} .link-box{background:#020617;color:#4ade80;padding:8px;border-radius:8px;margin-top:6px;font-size:12px;direction:ltr;word-break:break-all;border:1px dashed #22c55e} /* CHAT */ #chatCard{width:min(94vw,360px);display:flex;flex-direction:column;height:min(92vw,460px);max-height:500px} #chatMessages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px;background:#0f172a;border-radius:10px;margin:8px 0} .msg{padding:8px 12px;border-radius:12px;max-width:80%;font-size:13px;line-height:1.3;word-break:break-word} .msg.me{align-self:flex-end;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;border-bottom-right-radius:2px} .msg.them{align-self:flex-start;background:#334155;color:#fff;border-bottom-left-radius:2px} .msg.system{align-self:center;background:#020617;color:#94a3b8;font-size:11px} #chatInputRow{display:flex;gap:6px} #chatInputRow input{flex:1;text-align:right;direction:rtl} .coords{font-size:9px;color:rgba(0,0,0,.5);position:absolute;bottom:1px;right:2px;font-weight:700} .badge{background:#22c55e;color:#000;padding:2px 8px;border-radius:20px;font-size:11px}</style></head><body><h1>♟️ ابن مصر للشطرنج - عالمي</h1><div class="layout"><div style="display:flex;flex-direction:column;align-items:center"><div class="card" id="onlineCard"><div id="setup" style="display:flex;flex-direction:column;gap:8px"><button class="primary" onclick="createRoom()">🔥 إنشاء غرفة أونلاين</button><div style="text-align:center;opacity:.5;font-size:12px">- أو -</div><div style="display:flex;gap:6px"><input id="joinInput" placeholder="كود الغرفة"><button onclick="joinRoom()">دخول</button></div></div><div id="roomInfo" style="display:none"><div><span class="badge">متصل</span> ابعت لصاحبك:</div><div id="shareLink" class="link-box"></div><div style="display:flex;gap:6px;margin-top:6px"><button onclick="copyLink()" style="flex:1">📋 نسخ</button><button onclick="location.href=location.pathname" style="flex:1">خروج</button></div><div id="peerStatus" style="margin-top:6px;color:#fbbf24;font-weight:700;font-size:13px">⏳ مستني صاحبك...</div></div></div><div id="status">اعمل غرفة عشان تلعب أونلاين</div><div id="board"></div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="newGame(true)" class="primary">لعبة جديدة</button><button onclick="flipBoard()">قلب</button><button onclick="undoMove()">تراجع</button></div></div><div class="card" id="chatCard"><div style="font-weight:800">💬 دردشة اللعبة <span style="font-weight:400;font-size:11px;opacity:.6">- رسائل فورية</span></div><div id="chatMessages"><div class="msg system">مرحبا! هنا تقدر تكلم صاحبك أثناء اللعب ♟️</div></div><div id="chatInputRow"><input id="chatInput" placeholder="اكتب رسالة واضغط Enter..." onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">إرسال</button></div></div></div><script>
const P={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let board,turn='w',sel=null,moves=[],hist=[],flipped=false,myColor='w',isOnline=false,peer=null,conn=null,roomId=null;
const files=['a','b','c','d','e','f','g','h'];
function initBoard(){return[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];}
function newGame(b){board=initBoard();turn='w';sel=null;moves=[];hist=[];render();addSysMsg('🔄 بدأت لعبة جديدة');if(b&&conn&&conn.open)conn.send({type:'sync',board,turn,hist});}
function isWhite(c){return c&&c===c.toUpperCase()&&c!==''}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function getMoves(r,c){const p=board[r][c];if(!p)return[];const m=[];const w=isWhite(p);const dir=w?-1:1;const add=(rr,cc)=>{if(!inside(rr,cc))return false;const t=board[rr][cc];if(t===''){m.push([rr,cc]);return true;}else{if(isWhite(t)!==w)m.push([rr,cc]);return false;}};const low=p.toLowerCase();if(low==='p'){if(board[r+dir]?.[c]===''){m.push([r+dir,c]);if((w&&r===6||!w&&r===1)&&board[r+2*dir][c]==='')m.push([r+2*dir,c]);}for(let dc of[-1,1]){let rr=r+dir,cc=c+dc;if(inside(rr,cc)&&board[rr][cc]!==''&&isWhite(board[rr][cc])!==w)m.push([rr,cc]);}}else if(low==='r'||low==='q'){for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break;}}if(low!=='q')return m;}if(low==='b'||low==='q'){for(let[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break;}}if(low==='b')return m;}if(low==='n'){for(let[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc);}if(low==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);}return m;}
function render(){const b=document.getElementById('board');b.innerHTML='';for(let r=0;r<8;r++){for(let c=0;c<8;c++){let rr=flipped?7-r:r,cc=flipped?7-c:c;const cell=document.createElement('div');cell.className='cell '+((rr+cc)%2===0?'light':'dark');const piece=board[rr][cc];cell.textContent=piece?P[piece]:'';if(piece)cell.classList.add(isWhite(piece)?'white-piece':'black-piece');if(sel&&sel[0]===rr&&sel[1]===cc)cell.classList.add('sel');if(moves.some(([mr,mc])=>mr===rr&&mc===cc)){if(board[rr][cc]==='')cell.classList.add('dot');else cell.classList.add('cap');}cell.onclick=()=>clickCell(rr,cc);if(c===7){let s=document.createElement('span');s.className='coords';s.textContent=8-rr;cell.appendChild(s);}if(r===7){let s=document.createElement('span');s.className='coords';s.style.left='3px';s.style.right='auto';s.textContent=files[cc];cell.appendChild(s);}b.appendChild(cell);}}let txt=isOnline?`انت ${myColor==='w'?'أبيض ⚪':'أسود ⚫'} | ${turn==='w'?'دور الأبيض':'دور الأسود'} ${turn!==myColor?' ⏳':''}`:`${turn==='w'?'⚪ دور الأبيض':'⚫ دور الأسود'}`;document.getElementById('status').textContent=txt;}
function clickCell(r,c){if(isOnline&&turn!==myColor)return;const p=board[r][c];if(sel){if(moves.some(([mr,mc])=>mr===r&&mc===c)){hist.push(JSON.parse(JSON.stringify({board:board.map(x=>[...x]),turn})));board[r][c]=board[sel[0]][sel[1]];board[sel[0]][sel[1]]='';if(board[r][c].toLowerCase()==='p'&&(r===0||r===7))board[r][c]=isWhite(board[r][c])?'Q':'q';turn=turn==='w'?'b':'w';sel=null;moves=[];render();if(conn&&conn.open)conn.send({type:'sync',board,turn,hist});return;}else{sel=null;moves=[];}}if(p!==''&&((turn==='w'&&isWhite(p))||(turn==='b'&&!isWhite(p)))){if(isOnline&&((myColor==='w'&&!isWhite(p))||(myColor==='b'&&isWhite(p))))return;sel=[r,c];moves=getMoves(r,c);}render();}
function flipBoard(){flipped=!flipped;render();}function undoMove(){if(hist.length){let prev=hist.pop();board=prev.board.map(x=>[...x]);turn=prev.turn;render();if(conn&&conn.open)conn.send({type:'sync',board,turn,hist});}}
// CHAT
function addMsg(text,who){const box=document.getElementById('chatMessages');const div=document.createElement('div');div.className='msg '+(who==='me'?'me':who==='them'?'them':'system');div.textContent=text;box.appendChild(div);box.scrollTop=box.scrollHeight;}
function addSysMsg(t){addMsg(t,'system');}
function sendChat(){const inp=document.getElementById('chatInput');let t=inp.value.trim();if(!t)return;addMsg(t,'me');inp.value='';if(conn&&conn.open)conn.send({type:'chat',text:t});}
function createRoom(){roomId='ibn-masr-'+Math.random().toString(36).substr(2,6);myColor='w';peer=new Peer(roomId);peer.on('open',()=>showRoom());peer.on('connection',c=>{conn=c;setupConn();});}
function joinRoom(){let id=document.getElementById('joinInput').value.trim();if(!id){let u=new URLSearchParams(location.search);if(u.get('join'))id=u.get('join');}if(!id){alert('الصق كود الغرفة');return;}roomId=id;myColor='b';flipped=true;peer=new Peer();peer.on('open',()=>{conn=peer.connect(roomId);conn.on('open',()=>{isOnline=true;document.getElementById('setup').style.display='none';document.getElementById('roomInfo').style.display='block';document.getElementById('shareLink').textContent='متصل!';document.getElementById('peerStatus').textContent='✅ متصل! انت الأسود ⚫';addSysMsg('✅ دخلت الغرفة - انت الأسود');setupConn();});});}
function showRoom(){isOnline=true;document.getElementById('setup').style.display='none';document.getElementById('roomInfo').style.display='block';let link=location.origin+location.pathname+'?join='+roomId;document.getElementById('shareLink').textContent=link;addSysMsg('🔥 انشأت غرفة - ابعت اللينك لصاحبك');}
function setupConn(){conn.on('data',d=>{if(d.type==='sync'){board=d.board.map(x=>[...x]);turn=d.turn;hist=d.hist||[];sel=null;moves=[];render();}else if(d.type==='chat'){addMsg(d.text,'them');}});conn.on('open',()=>{document.getElementById('peerStatus').textContent='✅ صاحبك دخل! انت الأبيض ابدأ ⚪';addSysMsg('✅ صاحبك دخل الغرفة! ابدأ اللعب');conn.send({type:'sync',board,turn,hist});});}
function copyLink(){navigator.clipboard.writeText(document.getElementById('shareLink').textContent);alert('✅ تم نسخ اللينك!');}
board=initBoard();render();let params=new URLSearchParams(location.search);if(params.get('join')){document.getElementById('joinInput').value=params.get('join');joinRoom();}
</script></body></html>


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابن مصر للشطرنج - نظام الأدمن والشات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0e0d;font-family:'Cairo',Tahoma;color:#fff;min-height:100vh}
.header{background:#1a1816;border-bottom:2px solid #f7c948;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{color:#f7c948;font-size:22px}
.badge{background:#f7c948;color:#000;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:800}
.btn{padding:8px 14px;border:none;border-radius:8px;font-family:'Cairo';font-weight:700;cursor:pointer;font-size:13px}
.btn-gold{background:#f7c948;color:#000}.btn-dark{background:#2c2a28;color:#fff;border:1px solid #444}.btn-red{background:#e74c3c;color:#fff}.btn-green{background:#27ae60;color:#fff}
.main{display:flex;gap:12px;padding:12px;flex-wrap:wrap;justify-content:center;max-width:1400px;margin:auto}
.board-wrap{background:#262421;border-radius:12px;padding:12px}
#board{width:320px;height:320px;border:3px solid #f7c948;display:block;line-height:0;background:#fff}
.row{display:flex;width:320px;height:40px}.sq{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.light{background:#f0d9b5;color:#000}.dark{background:#b58863;color:#000}
.sq.sel{outline:3px solid #f7c948;outline-offset:-3px}.sq.last{background:#f6f668!important}.sq.legal{background:#81c784!important}.sq.check{background:#ef5350!important}
.side{width:360px;display:flex;flex-direction:column;gap:10px}
.card{background:#1e1c1a;border-radius:12px;padding:12px;border:1px solid #2c2a28}
.card h3{color:#f7c948;font-size:15px;margin-bottom:8px;border-bottom:1px solid #333;padding-bottom:6px}
.status{padding:8px;background:#2c2a28;border-radius:8px;text-align:center;font-weight:700;font-size:13px}
.player-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#2c2a28;border-radius:6px;margin-bottom:6px;font-size:13px}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.sticker{width:56px;height:56px;background:#2c2a28;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;border:2px solid transparent}
.sticker.earned{border-color:#f7c948;background:#3a3520;box-shadow:0 0 10px rgba(247,201,72,.3)}
.sticker .lbl{font-size:8px;margin-top:2px;color:#aaa}
.chat-box{height:220px;overflow-y:auto;background:#0f0e0d;border-radius:8px;padding:8px;border:1px solid #333}
.msg{padding:6px 8px;margin:4px 0;border-radius:8px;font-size:13px;max-width:85%}
.msg.me{background:#f7c948;color:#000;margin-right:auto}.msg.other{background:#2c2a28}.msg.system{background:transparent;color:#f7c948;text-align:center;font-size:11px;border:1px dashed #f7c948}
.chat-input{display:flex;gap:6px;margin-top:8px}.chat-input input{flex:1;padding:8px;border-radius:8px;border:1px solid #444;background:#0f0e0d;color:#fff;font-family:'Cairo'}
.admin-panel{background:#1a0f0f;border:2px solid #e74c3c;border-radius:12px;padding:12px}
.req-item{background:#2c1a1a;border:1px solid #e74c3c;border-radius:8px;padding:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-card{background:#1e1c1a;padding:24px;border-radius:16px;width:90%;max-width:380px;border:2px solid #f7c948;text-align:center}
.login-card input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #444;background:#0f0e0d;color:#fff;font-family:'Cairo';text-align:center}
</style>
</head>
<body>
<div class="header">
<h1>♟️ ابن مصر للشطرنج</h1>
<div class="right">
<span id="roleBadge" class="badge">زائر</span>
<span id="playerNameDisplay"></span>
<button class="btn btn-dark" onclick="showLogin()">دخول</button>
<button class="btn btn-dark" onclick="copyInvite()">دعوة صحابك 🔗</button>
<button id="adminBtn" class="btn btn-red" style="display:none" onclick="toggleAdmin()">لوحة الأدمن 👑</button>
</div>
</div>
<div class="main">
<div class="board-wrap"><div id="board"></div></div>
<div class="side">
<div class="card"><div id="status" class="status">دور الأبيض - اختر قطعة</div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-gold" onclick="newGame()">لعبة جديدة</button><button class="btn btn-dark" onclick="undoMove()">تراجع</button><button class="btn btn-dark" onclick="flipBoard()">قلب الرقعة</button></div></div>
<div class="card"><h3>👥 اللاعبين <span id="onlineCount" style="float:left">0</span></h3><div id="playersList"></div></div>
<div class="card"><h3>🏆 ملصقات الأعضاء</h3><div id="stickers" class="stickers"></div></div>
<div class="card" id="chatCard" style="display:none"><h3>💬 شات الغرفة</h3><div id="chatBox" class="chat-box"></div><div class="chat-input"><input id="chatInput" placeholder="اكتب رسالة..." onkeypress="if(event.key=='Enter')sendMsg()"><button class="btn btn-gold" onclick="sendMsg()">إرسال</button></div></div>
<div class="card" id="requestChatCard"><h3>🔒 طلب فتح الشات</h3><p style="font-size:12px;color:#aaa">الشات بيفتح بس بعد موافقة الأدمن</p><button class="btn btn-gold" id="reqChatBtn" onclick="requestChat()">طلب فتح الشات 🙏</button><div id="reqStatus" style="font-size:12px;margin-top:8px;color:#f7c948"></div></div>
<div id="adminPanel" class="admin-panel" style="display:none"><h3 style="color:#e74c3c">👑 لوحة تحكم الأدمن</h3><div style="margin-top:10px"><h4 style="font-size:13px">📩 طلبات الشات:</h4><div id="chatRequests"></div></div><div style="margin-top:12px"><h4 style="font-size:13px">🚫 حظر:</h4><div id="adminPlayers"></div></div><div style="margin-top:12px"><button class="btn btn-dark" onclick="clearChat()">مسح الشات 🗑️</button><button class="btn btn-dark" onclick="resetAll()">تصفير الغرفة 🔄</button></div></div>
<div class="card"><div style="background:#0f0e0d;padding:8px;border-radius:6px;font-size:11px;word-break:break-all" id="inviteLink"></div><button class="btn btn-green" style="margin-top:8px;width:100%" onclick="copyInvite()">نسخ رابط الدعوة 📋</button></div>
</div>
</div>
<div id="loginOverlay" class="login-overlay" style="display:flex"><div class="login-card"><h2 style="color:#f7c948">أهلا بيك ♟️</h2><input id="loginName" placeholder="اسمك..."><input id="loginPass" type="password" placeholder="كلمة سر الأدمن"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-gold" style="flex:1" onclick="doLogin()">دخول كـ لاعب</button><button class="btn btn-red" style="flex:1" onclick="doAdminLogin()">دخول كـ أدمن 👑</button></div><p style="font-size:11px;color:#666;margin-top:12px">كلمة السر: <b style="color:#fff">admin123</b></p><button class="btn btn-dark" style="margin-top:10px;width:100%" onclick="guestLogin()">دخول كـ زائر</button></div></div>
<script>
function getStore(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function setStore(k,v){localStorage.setItem(k,JSON.stringify(v))}
let currentUser=getStore('ibn_current_user',null),role=getStore('ibn_role','guest'),banned=getStore('ibn_banned',[]),chatRequests=getStore('ibn_chat_requests',[]),approvedChats=getStore('ibn_approved_chats',[]),players=getStore('ibn_players',[]),chatMsgs=getStore('ibn_chat_msgs',[]),stickerData=getStore('ibn_stickers_'+(currentUser||'guest'),{games:0,wins:0,plays:0});
let board,turn='w',castling,enPassant,history=[],flipped=false,selected=null,legalMoves=[],lastMove=null,gameOver=false;
const uni={w:{p:'♙',n:'♘',b:'♗',r:'♖',q:'♕',k:'♔'},b:{p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}};
const ALL_STICKERS=[{id:'first',icon:'🎮',name:'أول لعبة'},{id:'warrior',icon:'⚔️',name:'محارب'},{id:'king',icon:'👑',name:'ملك'},{id:'chat',icon:'💬',name:'اجتماعي'},{id:'friend',icon:'🤝',name:'صاحب جدع'},{id:'streak',icon:'🔥',name:'مولع'},{id:'master',icon:'🏆',name:'أستاذ'},{id:'admin',icon:'👑',name:'أدمن'}];
function initBoard(){board=[[{t:'r',c:'b'},{t:'n',c:'b'},{t:'b',c:'b'},{t:'q',c:'b'},{t:'k',c:'b'},{t:'b',c:'b'},{t:'n',c:'b'},{t:'r',c:'b'}],[{t:'p',c:'b'},{t:'p',c:'b'},{t:'p',c:'b'},{t:'p',c:'b'},{t:'p',c:'b'},{t:'p',c:'b'},{t:'p',c:'b'},{t:'p',c:'b'}],[null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],[{t:'p',c:'w'},{t:'p',c:'w'},{t:'p',c:'w'},{t:'p',c:'w'},{t:'p',c:'w'},{t:'p',c:'w'},{t:'p',c:'w'},{t:'p',c:'w'}],[{t:'r',c:'w'},{t:'n',c:'w'},{t:'b',c:'w'},{t:'q',c:'w'},{t:'k',c:'w'},{t:'b',c:'w'},{t:'n',c:'w'},{t:'r',c:'w'}]];castling={wK:true,wQ:true,bK:true,bQ:true};enPassant=null;history=[];turn='w';selected=null;legalMoves=[];lastMove=null;gameOver=false;}
function clone(b){var nb=[];for(var r=0;r<8;r++){nb[r]=[];for(var c=0;c<8;c++){var p=b[r][c];nb[r][c]=p?{t:p.t,c:p.c}:null}}return nb}
function findK(b,col){for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=b[r][c];if(p&&p.t=='k'&&p.c==col)return[r,c]}return null}
function canAttack(b,fr,fc,tr,tc){var p=b[fr][fc];if(!p)return false;var dr=tr-fr,dc=tc-fc,adr=Math.abs(dr),adc=Math.abs(dc);if(p.t=='p'){var dir=p.c=='w'?-1:1;return dr==dir&&adc==1}if(p.t=='n')return(adr==1&&adc==2)||(adr==2&&adc==1);if(p.t=='b'||p.t=='r'||p.t=='q'){if(p.t=='b'&&adr!=adc)return false;if(p.t=='r'&&adr!=0&&adc!=0)return false;if(p.t=='q'&&!(adr==adc||adr==0||adc==0))return false;var sr=dr==0?0:(dr>0?1:-1),sc=dc==0?0:(dc>0?1:-1);var R=fr+sr,C=fc+sc;while(R!=tr||C!=tc){if(b[R][C])return false;R+=sr;C+=sc}return true}if(p.t=='k')return adr<=1&&adc<=1;return false}
function attacked(b,r,c,by){for(var R=0;R<8;R++)for(var C=0;C<8;C++){var p=b[R][C];if(!p||p.c!=by)continue;if(canAttack(b,R,C,r,c))return true}return false}
function pseudo(b,r,c){var p=b[r][c];if(!p)return[];var moves=[],col=p.c,dir=col=='w'?-1:1;if(p.t=='p'){var nr=r+dir;if(nr>=0&&nr<8&&!b[nr][c]){moves.push([nr,c]);if((col=='w'&&r==6||col=='b'&&r==1)&&!b[nr+dir][c])moves.push([nr+dir,c])}for(var dc=-1;dc<=1;dc+=2){var nc=c+dc;var tr=r+dir;if(nc<0||nc>7||tr<0||tr>7)continue;if(b[tr][nc]&&b[tr][nc].c!=col)moves.push([tr,nc]);if(enPassant&&enPassant[0]==tr&&enPassant[1]==nc)moves.push([tr,nc,true])}}if(p.t=='n'){var ds=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];for(var i=0;i<ds.length;i++){var nr=r+ds[i][0],nc=c+ds[i][1];if(nr>=0&&nr<8&&nc>=0&&nc<8&&(!b[nr][nc]||b[nr][nc].c!=col))moves.push([nr,nc])}}if(p.t=='b'||p.t=='r'||p.t=='q'){var dirs=[];if(p.t=='b'||p.t=='q')dirs=dirs.concat([[-1,-1],[-1,1],[1,-1],[1,1]]);if(p.t=='r'||p.t=='q')dirs=dirs.concat([[-1,0],[1,0],[0,-1],[0,1]]);for(var d=0;d<dirs.length;d++){var nr=r+dirs[d][0],nc=c+dirs[d][1];while(nr>=0&&nr<8&&nc>=0&&nc<8){if(!b[nr][nc])moves.push([nr,nc]);else{if(b[nr][nc].c!=col)moves.push([nr,nc]);break}nr+=dirs[d][0];nc+=dirs[d][1]}}}if(p.t=='k'){for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(dr==0&&dc==0)continue;var nr=r+dr,nc=c+dc;if(nr>=0&&nr<8&&nc>=0&&nc<8&&(!b[nr][nc]||b[nr][nc].c!=col))moves.push([nr,nc])}if(col=='w'&&r==7&&c==4){if(castling.wK&&!b[7][5]&&!b[7][6]&&!attacked(b,7,4,'b')&&!attacked(b,7,5,'b')&&!attacked(b,7,6,'b'))moves.push([7,6,'K']);if(castling.wQ&&!b[7][1]&&!b[7][2]&&!b[7][3]&&!attacked(b,7,4,'b')&&!attacked(b,7,3,'b')&&!attacked(b,7,2,'b'))moves.push([7,2,'Q'])}if(col=='b'&&r==0&&c==4){if(castling.bK&&!b[0][5]&&!b[0][6]&&!attacked(b,0,4,'w')&&!attacked(b,0,5,'w')&&!attacked(b,0,6,'w'))moves.push([0,6,'K']);if(castling.bQ&&!b[0][1]&&!b[0][2]&&!b[0][3]&&!attacked(b,0,4,'w')&&!attacked(b,0,3,'w')&&!attacked(b,0,2,'w'))moves.push([0,2,'Q'])}}return moves;}
function legalAll(){var all=[];for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=board[r][c];if(!p||p.c!=turn)continue;var ps=pseudo(board,r,c);for(var i=0;i<ps.length;i++){var tr=ps[i][0],tc=ps[i][1],ex=ps[i][2];var nb=clone(board);if(ps[i][2]===true)nb[r][tc]=null;nb[tr][tc]=nb[r][c];nb[r][c]=null;if(ex=='K'){nb[tr][tc-1]=nb[tr][7];nb[tr][7]=null}if(ex=='Q'){nb[tr][tc+1]=nb[tr][0];nb[tr][0]=null}var kp=findK(nb,turn);if(!kp)continue;if(attacked(nb,kp[0],kp[1],turn=='w'?'b':'w'))continue;all.push({from:[r,c],to:[tr,tc],ep:ps[i][2]===true,castle:ex,promo:(p.t=='p'&&(tr==0||tr==7))})}}return all}
function renderBoard(){var el=document.getElementById('board');el.innerHTML='';for(var r=0;r<8;r++){var row=document.createElement('div');row.className='row';for(var c=0;c<8;c++){var rr=flipped?7-r:r,cc=flipped?7-c:c;var sq=document.createElement('div');sq.className='sq '+((rr+cc)%2==0?'light':'dark');if(selected&&selected[0]==rr&&selected[1]==cc)sq.className+=' sel';if(lastMove&&((lastMove.from[0]==rr&&lastMove.from[1]==cc)||(lastMove.to[0]==rr&&lastMove.to[1]==cc)))sq.className+=' last';var lm=null;for(var i=0;i<legalMoves.length;i++)if(legalMoves[i].to[0]==rr&&legalMoves[i].to[1]==cc)lm=legalMoves[i];if(selected&&lm)sq.className+=' legal';var p=board[rr][cc];if(p){sq.textContent=uni[p.c][p.t]}(function(R,C){sq.onclick=function(){click(R,C)}})(rr,cc);row.appendChild(sq);}el.appendChild(row);}var all=legalAll();var k=findK(board,turn);var inCheck=k?attacked(board,k[0],k[1],turn=='w'?'b':'w'):false;var st=document.getElementById('status');if(all.length==0){if(inCheck){st.textContent=(turn=='w'?'الأسود فاز!':'الأبيض فاز!');handleWin()}else{st.textContent='تعادل!'}gameOver=true;return}if(inCheck)st.textContent=(turn=='w'?'الأبيض في كش!':'الأسود في كش!');else st.textContent='دور '+(turn=='w'?'الأبيض':'الأسود');}
function click(r,c){if(gameOver)return;if(role=='guest'){alert('ادخل كـ لاعب عشان تلعب!');return}var p=board[r][c];if(selected){for(var i=0;i<legalMoves.length;i++){var m=legalMoves[i];if(m.to[0]==r&&m.to[1]==c){doMove(m);return}}if(p&&p.c==turn){selected=[r,c];legalMoves=[];var all=legalAll();for(var j=0;j<all.length;j++)if(all[j].from[0]==r&&all[j].from[1]==c)legalMoves.push(all[j]);renderBoard();return}selected=null;legalMoves=[];renderBoard();return;}if(p&&p.c==turn){selected=[r,c];legalMoves=[];var all=legalAll();for(var j=0;j<all.length;j++)if(all[j].from[0]==r&&all[j].from[1]==c)legalMoves.push(all[j]);renderBoard()}}
function doMove(m){var fr=m.from[0],fc=m.from[1],tr=m.to[0],tc=m.to[1];var pc=board[fr][fc];if(pc.t=='k'){if(pc.c=='w'){castling.wK=false;castling.wQ=false}else{castling.bK=false;castling.bQ=false}}if(pc.t=='r'){if(fr==7&&fc==0)castling.wQ=false;if(fr==7&&fc==7)castling.wK=false;if(fr==0&&fc==0)castling.bQ=false;if(fr==0&&fc==7)castling.bK=false}history.push({b:clone(board),t:turn});board[tr][tc]=board[fr][fc];board[fr][fc]=null;if(m.ep)board[fr][tc]=null;if(m.castle){if(m.castle=='K'){board[tr][5]=board[tr][7];board[tr][7]=null}else{board[tr][3]=board[tr][0];board[tr][0]=null}}if(m.promo){var pr=prompt('ترقية: q=وزير r=رخ b=فيل n=حصان','q')||'q';board[tr][tc]={t:pr,c:pc.c}}if(pc.t=='p'&&Math.abs(tr-fr)==2)enPassant=[(fr+tr)/2,fc];else enPassant=null;lastMove={from:[fr,fc],to:[tr,tc]};turn=turn=='w'?'b':'w';selected=null;legalMoves=[];stickerData.plays=(stickerData.plays||0)+1;saveStickers();renderBoard();renderStickers();}
function newGame(){initBoard();renderBoard();stickerData.games=(stickerData.games||0)+1;saveStickers();renderStickers();}
function undoMove(){if(history.length>0){var h=history.pop();board=h.b;turn=h.t;renderBoard()}}
function flipBoard(){flipped=!flipped;renderBoard()}
function handleWin(){stickerData.wins=(stickerData.wins||0)+1;saveStickers();renderStickers();}
function showLogin(){document.getElementById('loginOverlay').style.display='flex'}
function guestLogin(){currentUser='زائر_'+Math.floor(Math.random()*999);role='guest';setStore('ibn_current_user',currentUser);setStore('ibn_role',role);hideLogin();updateUI()}
function doLogin(){var name=document.getElementById('loginName').value.trim();if(!name){alert('اكتب اسمك');return}if(banned.includes(name)){alert('أنت محظور 🚫');return}currentUser=name;role='player';setStore('ibn_current_user',currentUser);setStore('ibn_role',role);if(!players.includes(name)){players.push(name);setStore('ibn_players',players)}hideLogin();updateUI();}
function doAdminLogin(){var name=document.getElementById('loginName').value.trim()||'الأدمن';var pass=document.getElementById('loginPass').value;if(pass!=='admin123'){alert('كلمة السر غلط! الافتراضية: admin123');return}currentUser=name;role='admin';setStore('ibn_current_user',currentUser);setStore('ibn_role',role);if(!players.includes(name)){players.push(name);setStore('ibn_players',players)}hideLogin();updateUI();}
function hideLogin(){document.getElementById('loginOverlay').style.display='none'}
function updateUI(){document.getElementById('playerNameDisplay').textContent=currentUser?currentUser:'';var badge=document.getElementById('roleBadge');if(role=='admin'){badge.textContent='أدمن 👑';badge.style.background='#e74c3c';document.getElementById('adminBtn').style.display='inline-block'}else if(role=='player'){badge.textContent='لاعب';badge.style.background='#27ae60';document.getElementById('adminBtn').style.display='none'}else{badge.textContent='زائر';document.getElementById('adminBtn').style.display='none'}checkChatAccess();renderPlayers();renderStickers();renderChat();renderRequests();}
function copyInvite(){var link=location.href;document.getElementById('inviteLink').textContent=link;navigator.clipboard.writeText(link).then(()=>alert('تم نسخ رابط الدعوة!'))}
function requestChat(){if(role=='guest'){alert('ادخل كـ لاعب أول');return}if(banned.includes(currentUser)){alert('محظور');return}if(approvedChats.includes(currentUser)){alert('الشات مفتوح ليك!');return}if(chatRequests.includes(currentUser)){document.getElementById('reqStatus').textContent='طلبك اتبعت، مستني موافقة الأدمن ⏳';return}chatRequests.push(currentUser);setStore('ibn_chat_requests',chatRequests);document.getElementById('reqStatus').textContent='تم إرسال الطلب!';addSystemMsg(currentUser+' طلب فتح الشات 🙏');renderRequests();}
function approveChat(name){if(!approvedChats.includes(name)){approvedChats.push(name);setStore('ibn_approved_chats',approvedChats)}chatRequests=chatRequests.filter(n=>n!=name);setStore('ibn_chat_requests',chatRequests);addSystemMsg('الأدمن وافق على '+name+' ✅');renderRequests();renderChat();}
function rejectChat(name){chatRequests=chatRequests.filter(n=>n!=name);setStore('ibn_chat_requests',chatRequests);renderRequests();}
function checkChatAccess(){var hasAccess=role=='admin'||approvedChats.includes(currentUser);var chatCard=document.getElementById('chatCard');var reqCard=document.getElementById('requestChatCard');if(hasAccess){chatCard.style.display='block';reqCard.style.display='none'}else{chatCard.style.display='none';reqCard.style.display='block';if(role=='admin'){chatCard.style.display='block';reqCard.style.display='none'}}}
function sendMsg(){var input=document.getElementById('chatInput');var text=input.value.trim();if(!text)return;if(role=='guest'){alert('لازم تدخل كـ لاعب');return}if(banned.includes(currentUser)){alert('محظور');return}if(role!='admin'&&!approvedChats.includes(currentUser)){alert('لازم الأدمن يوافق أول');return}chatMsgs.push({name:currentUser,text:text,time:Date.now(),role:role});setStore('ibn_chat_msgs',chatMsgs);input.value='';renderChat();stickerData.msgs=(stickerData.msgs||0)+1;saveStickers();renderStickers();}
function addSystemMsg(text){chatMsgs.push({name:'النظام',text:text,time:Date.now(),role:'system'});setStore('ibn_chat_msgs',chatMsgs);renderChat()}
function renderChat(){var box=document.getElementById('chatBox');if(!box)return;box.innerHTML='';chatMsgs.slice(-50).forEach(m=>{var div=document.createElement('div');div.className='msg '+(m.role=='system'?'system':(m.name==currentUser?'me':'other'));var icon=m.role=='admin'?'👑 ':'';div.innerHTML='<b>'+icon+m.name+':</b> '+m.text;box.appendChild(div)});box.scrollTop=box.scrollHeight;}
function clearChat(){if(confirm('تمسح الشات؟')){chatMsgs=[];setStore('ibn_chat_msgs',chatMsgs);renderChat()}}
function renderPlayers(){var list=document.getElementById('playersList');var adminList=document.getElementById('adminPlayers');var count=document.getElementById('onlineCount');if(!list)return;list.innerHTML='';if(adminList)adminList.innerHTML='';count.textContent=players.length;players.forEach(name=>{var isBanned=banned.includes(name);var div=document.createElement('div');div.className='player-item';div.innerHTML='<span>'+name+(isBanned?' 🚫':(approvedChats.includes(name)?' ✅':''))+'</span>';if(role=='admin'&&name!=currentUser){var btn=document.createElement('button');btn.className='btn '+(isBanned?'btn-green':'btn-red');btn.style.fontSize='11px';btn.textContent=isBanned?'فك الحظر':'حظر';btn.onclick=function(){toggleBan(name)};div.appendChild(btn);}list.appendChild(div);if(adminList&&role=='admin'){var div2=document.createElement('div');div2.className='player-item';div2.innerHTML='<span>'+name+'</span>';var btn2=document.createElement('button');btn2.className='btn '+(isBanned?'btn-green':'btn-red');btn2.style.fontSize='11px';btn2.textContent=isBanned?'فك الحظر':'حظر';(function(n){btn2.onclick=function(){toggleBan(n)}})(name);div2.appendChild(btn2);adminList.appendChild(div2);}});}
function toggleBan(name){if(banned.includes(name)){banned=banned.filter(n=>n!=name)}else{banned.push(name);approvedChats=approvedChats.filter(n=>n!=name);setStore('ibn_approved_chats',approvedChats);chatRequests=chatRequests.filter(n=>n!=name);setStore('ibn_chat_requests',chatRequests)}setStore('ibn_banned',banned);renderPlayers();checkChatAccess();addSystemMsg((banned.includes(name)?'تم حظر ':'تم فك حظر ')+name);}
function renderRequests(){var el=document.getElementById('chatRequests');if(!el)return;el.innerHTML='';if(chatRequests.length==0){el.innerHTML='<p style="font-size:12px;color:#888">لا يوجد طلبات</p>';return}chatRequests.forEach(name=>{var div=document.createElement('div');div.className='req-item';div.innerHTML='<span>💬 '+name+' عايز يفتح الشات</span>';var btns=document.createElement('div');btns.style.display='flex';btns.style.gap='6px';var ok=document.createElement('button');ok.className='btn btn-green';ok.textContent='موافقة ✅';ok.onclick=function(){approveChat(name)};var no=document.createElement('button');no.className='btn btn-red';no.textContent='رفض ❌';no.onclick=function(){rejectChat(name)};btns.appendChild(ok);btns.appendChild(no);div.appendChild(btns);el.appendChild(div);});}
function resetAll(){if(confirm('تصفير كل حاجة؟')){localStorage.clear();location.reload()}}
function saveStickers(){setStore('ibn_stickers_'+currentUser,stickerData)}
function renderStickers(){var el=document.getElementById('stickers');if(!el)return;el.innerHTML='';ALL_STICKERS.forEach(s=>{var earned=false;if(s.id=='first'&&stickerData.games>=1)earned=true;if(s.id=='warrior'&&stickerData.games>=5)earned=true;if(s.id=='king'&&stickerData.wins>=3)earned=true;if(s.id=='chat'&&(stickerData.msgs||0)>=10)earned=true;if(s.id=='friend'&&players.length>=4)earned=true;if(s.id=='streak'&&stickerData.games>=10)earned=true;if(s.id=='master'&&stickerData.wins>=10)earned=true;if(s.id=='admin'&&role=='admin')earned=true;var div=document.createElement('div');div.className='sticker '+(earned?'earned':'');div.innerHTML='<div>'+s.icon+'</div><div class="lbl">'+s.name+'</div>';div.title=s.name+(earned?' ✅':'' );el.appendChild(div);});}
initBoard();renderBoard();document.getElementById('inviteLink').textContent=location.href;if(currentUser){hideLogin();updateUI()}
function toggleAdmin(){var p=document.getElementById('adminPanel');p.style.display=p.style.display=='none'?'block':'none'}
</script>
</body>

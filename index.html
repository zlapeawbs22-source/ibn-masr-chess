
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ابن مصر شطرنج - كل القوانين</title>
<script type="importmap">{"imports":{"trystero":"https://esm.run/trystero"}}</script>
<style>
body{background:#161616;color:#fff;margin:0;text-align:center;font-family:Arial}
h1{margin:8px;font-size:19px}
#status{background:#222;max-width:420px;margin:8px auto;padding:10px;border-radius:10px;font-weight:bold;font-size:13px}
#board{width:92vw;max-width:400px;height:92vw;max-height:400px;margin:8px auto;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #fff;border-radius:8px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;position:relative}
.white{background:#f0d9b5;color:#000}
.black{background:#b58863;color:#000}
.sel{outline:3px solid #ff0000;outline-offset:-3px}
.legal::after{content:"";width:14px;height:14px;background:rgba(0,255,0,0.6);border-radius:50%;position:absolute}
.check{background:#ff4444 !important}
button{background:#e50914;color:#fff;border:none;padding:8px 16px;border-radius:20px;margin:4px;cursor:pointer;font-weight:bold;font-size:12px}
#log{max-width:400px;margin:8px auto;background:#222;padding:8px;border-radius:8px;font-size:11px;max-height:80px;overflow:auto;text-align:left;direction:ltr}
</style>
</head>
<body>
<h1>♟️ ابن مصر - كل قوانين الشطرنج ♟️</h1>
<div id="status">🔍 بدور على خصم...</div>
<div id="board"></div>
<div id="log"></div>
<button onclick="location.reload()">لعبة جديدة</button>

<script type="module">
import {joinRoom} from "trystero/torrent";
const pieces={"r":"♜","n":"♞","b":"♝","q":"♛","k":"♚","p":"♟","R":"♖","N":"♘","B":"♗","Q":"♕","K":"♔","P":"♙"};

let board, selected=null, turn="white", myColor=null, room, legalMoves=[], history=[], castling={K:true,Q:true,k:true,q:true}, enPassant=null, halfMove=0;
const config={appId:"ibn-masr-chess-full-v2"};
room=joinRoom(config, "ibn-masr-full");
const [send, get]=room.makeAction("move");

room.onPeerJoin(()=>{
  if(!myColor){
    myColor=room.getPeers().length==0?"white":"black";
    if(room.getPeers().length>=1) start();
  }
});

get((data)=>{
  board=data.board; turn=data.turn; castling=data.castling; enPassant=data.enPassant;
  checkGameState(); draw();
});

function start(){
  document.getElementById('status').innerHTML=`✅ أنت ${myColor=="white"?"الأبيض ♔":"الأسود ♚"}`;
  init(); draw();
}

function init(){
  board=[
    ["r","n","b","q","k","b","n","r"],
    ["p","p","p","p","p","p","p","p"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["P","P","P","P","P","P","P","P"],
    ["R","N","B","Q","K","B","N","R"]
  ];
  turn="white"; castling={K:true,Q:true,k:true,q:true}; enPassant=null; history=[]; log("لعبة جديدة - الأبيض يبدأ");
}

function log(t){ document.getElementById('log').innerHTML+=t+"<br>"; document.getElementById('log').scrollTop=9999; }

function isWhite(p){ return p && p==p.toUpperCase(); }
function isBlack(p){ return p && p!=p.toUpperCase(); }
function inBoard(r,c){ return r>=0 && r<8 && c>=0 && c<8; }

function getMoves(r,c, checkKing=true){
  let p=board[r][c]; if(!p) return [];
  let moves=[]; let white=isWhite(p); let lower=p.toLowerCase();
  
  if(lower=="p"){
    let dir=white?-1:1; let startRow=white?6:1;
    // أمام
    if(inBoard(r+dir,c) && !board[r+dir][c]){
      moves.push([r+dir,c]);
      if(r==startRow && !board[r+dir*2][c]) moves.push([r+dir*2,c]);
    }
    // أكل
    for(let dc of [-1,1]){
      if(inBoard(r+dir,c+dc) && board[r+dir][c+dc] && isWhite(board[r+dir][c+dc])!=white){
        moves.push([r+dir,c+dc]);
      }
      // en passant
      if(enPassant && enPassant[0]==r+dir && enPassant[1]==c+dc) moves.push([r+dir,c+dc]);
    }
  }
  if(lower=="n"){
    for(let [dr,dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){
      let nr=r+dr, nc=c+dc;
      if(inBoard(nr,nc) && (!board[nr][nc] || isWhite(board[nr][nc])!=white)) moves.push([nr,nc]);
    }
  }
  if(lower=="b" || lower=="q"){
    for(let [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
      for(let i=1;i<8;i++){
        let nr=r+dr*i, nc=c+dc*i;
        if(!inBoard(nr,nc)) break;
        if(!board[nr][nc]) moves.push([nr,nc]);
        else { if(isWhite(board[nr][nc])!=white) moves.push([nr,nc]); break; }
      }
    }
  }
  if(lower=="r" || lower=="q"){
    for(let [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
      for(let i=1;i<8;i++){
        let nr=r+dr*i, nc=c+dc*i;
        if(!inBoard(nr,nc)) break;
        if(!board[nr][nc]) moves.push([nr,nc]);
        else { if(isWhite(board[nr][nc])!=white) moves.push([nr,nc]); break; }
      }
    }
  }
  if(lower=="k"){
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(dr==0 && dc==0) continue;
      let nr=r+dr, nc=c+dc;
      if(inBoard(nr,nc) && (!board[nr][nc] || isWhite(board[nr][nc])!=white)) moves.push([nr,nc]);
    }
    // تبييت
    if(checkKing){
      if(white && r==7 && c==4){
        if(castling.K && !board[7][5] && !board[7][6] && !isAttacked(7,4,false) && !isAttacked(7,5,false) && !isAttacked(7,6,false)) moves.push([7,6]);
        if(castling.Q && !board[7][1] && !board[7][2] && !board[7][3] && !isAttacked(7,4,false) && !isAttacked(7,3,false) && !isAttacked(7,2,false)) moves.push([7,2]);
      }
      if(!white && r==0 && c==4){
        if(castling.k && !board[0][5] && !board[0][6] && !isAttacked(0,4,true) && !isAttacked(0,5,true) && !isAttacked(0,6,true)) moves.push([0,6]);
        if(castling.q && !board[0][1] && !board[0][2] && !board[0][3] && !isAttacked(0,4,true) && !isAttacked(0,3,true) && !isAttacked(0,2,true)) moves.push([0,2]);
      }
    }
  }
  
  if(checkKing){
    // شيل الحركات اللي تسيب الملك في كش
    return moves.filter(([nr,nc])=>{
      let b2=board.map(row=>[...row]);
      let p2=b2[r][c];
      b2[nr][nc]=p2; b2[r][c]="";
      // en passant وهمي
      if(lower=="p" && enPassant && nr==enPassant[0] && nc==enPassant[1]) b2[r][nc]="";
      return !isKingInCheck(b2, white);
    });
  }
  return moves;
}

function isAttacked(r,c, byWhite){
  for(let rr=0;rr<8;rr++) for(let cc=0;cc<8;cc++){
    let p=board[rr][cc]; if(!p) continue;
    if(isWhite(p)!=byWhite) continue;
    let moves=getMoves(rr,cc,false);
    if(moves.some(([mr,mc])=>mr==r && mc==c)) return true;
  }
  return false;
}

function isKingInCheck(b, whiteKing){
  let kr, kc;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    let p=b[r][c]; if(!p) continue;
    if(p.toLowerCase()=="k" && isWhite(p)==whiteKing){ kr=r; kc=c; }
  }
  if(kr==undefined) return true;
  // شوف لو مهدد
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    let p=b[r][c]; if(!p) continue;
    if(isWhite(p)==whiteKing) continue;
    let moves=getMoves(r,c,false);
    // استخدم البورد المؤقت
    let old=board; board=b;
    let realMoves=getMoves(r,c,false);
    board=old;
    if(realMoves.some(([mr,mc])=>mr==kr && mc==kc)) return true;
  }
  // طريقة أسرع: شوف المهاجمين مباشرة
  return isAttacked(kr,kc,!whiteKing);
}

function checkGameState(){
  let whiteInCheck=isKingInCheck(board,true);
  let blackInCheck=isKingInCheck(board,false);
  let curWhite=turn=="white";
  let inCheck=curWhite?whiteInCheck:blackInCheck;
  
  // هل فيه حركة قانونية؟
  let hasMove=false;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    let p=board[r][c]; if(!p) continue;
    if(isWhite(p)!=curWhite) continue;
    if(getMoves(r,c,true).length>0) hasMove=true;
  }
  
  if(!hasMove){
    if(inCheck){
      document.getElementById('status').innerText=`♔ كش مات! ${curWhite?"الأسود":"الأبيض"} كسب`;
      log(`كش مات - ${curWhite?"الأسود كسب":"الأبيض كسب"}`);
    } else {
      document.getElementById('status').innerText="تعادل - خنق";
      log("تعادل");
    }
  } else if(inCheck){
    document.getElementById('status').innerText=`⚠️ كش ملك! دور ${turn=="white"?"الأبيض":"الأسود"}`;
  }
}

window.draw=function(){
  const b=document.getElementById('board');
  b.innerHTML="";
  let kingPos=null;
  // دور الملك اللي في كش
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(board[r][c].toLowerCase()=="k" && isWhite(board[r][c])==(turn=="white")){
      if(isKingInCheck(board, turn=="white")) kingPos=[r,c];
    }
  }
  
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      let realR=myColor=="black"?7-r:r;
      let realC=myColor=="black"?7-c:c;
      let sq=document.createElement('div');
      sq.className=`sq ${(realR+realC)%2==0?'white':'black'}`;
      if(kingPos && kingPos[0]==realR && kingPos[1]==realC) sq.classList.add('check');
      sq.dataset.r=realR; sq.dataset.c=realC;
      let p=board[realR][realC];
      if(p) sq.textContent=pieces[p];
      if(selected && selected.r==realR && selected.c==realC) sq.classList.add('sel');
      if(legalMoves.some(([lr,lc])=>lr==realR && lc==realC)) sq.classList.add('legal');
      sq.onclick=()=>window.click(realR,realC);
      b.appendChild(sq);
    }
  }
}

window.click=function(r,c){
  if(!myColor){ init(); myColor="white"; turn="white"; draw(); return; }
  let isMyTurn=(turn=="white" && myColor=="white") || (turn=="black" && myColor=="black");
  if(!isMyTurn && room.getPeers().length>0) return;
  
  if(selected){
    let move=legalMoves.find(([mr,mc])=>mr==r && mc==c);
    if(move){
      let p=board[selected.r][selected.c];
      // حفظ
      history.push({board:board.map(r=>[...r]), castling:{...castling}, enPassant});
      
      // en passant أكل
      if(p.toLowerCase()=="p" && enPassant && r==enPassant[0] && c==enPassant[1]){
        board[selected.r][c]="";
      }
      
      // تبييت
      if(p.toLowerCase()=="k" && Math.abs(c-selected.c)==2){
        if(c==6){ board[r][5]=board[r][7]; board[r][7]=""; }
        if(c==2){ board[r][3]=board[r][0]; board[r][0]=""; }
      }
      
      // حركة
      board[r][c]=p;
      board[selected.r][selected.c]="";
      
      // ترقية
      if(p.toLowerCase()=="p" && (r==0 || r==7)){
        let promo=prompt("ترقية لـ: q=وزير, r=رخ, b=فيل, n=حصان","q");
        if(!promo || !["q","r","b","n"].includes(promo)) promo="q";
        board[r][c]=isWhite(p)?promo.toUpperCase():promo;
      }
      
      // تحديث تبييت
      if(p=="K"){ castling.K=false; castling.Q=false; }
      if(p=="k"){ castling.k=false; castling.q=false; }
      if(p=="R" && selected.r==7 && selected.c==7) castling.K=false;
      if(p=="R" && selected.r==7 && selected.c==0) castling.Q=false;
      if(p=="r" && selected.r==0 && selected.c==7) castling.k=false;
      if(p=="r" && selected.r==0 && selected.c==0) castling.q=false;
      
      // en passant جديد
      if(p.toLowerCase()=="p" && Math.abs(r-selected.r)==2){
        enPassant=[(r+selected.r)/2, c];
      } else enPassant=null;
      
      turn=turn=="white"?"black":"white";
      log(`${p} ${String.fromCharCode(97+selected.c)}${8-selected.r} -> ${String.fromCharCode(97+c)}${8-r}`);
      checkGameState();
      draw();
      send({board, turn, castling, enPassant});
    }
    selected=null; legalMoves=[]; draw();
  } else {
    let p=board[r][c]; if(!p) return;
    let white=isWhite(p);
    if(white!=(turn=="white")) return;
    if(myColor && white!=(myColor=="white") && room.getPeers().length>0) return;
    selected={r,c};
    legalMoves=getMoves(r,c,true);
    draw();
  }
}

init(); draw();
setTimeout(()=>{ if(!myColor){ myColor="white"; document.getElementById('status').innerText="العب لوحدك أو افتح من جهاز تاني للعب أونلاين"; } },3000);
</script>
</body>
</html>

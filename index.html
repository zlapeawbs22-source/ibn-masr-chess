
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شطرنج أونلاين</title><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><style>body{background:#302e2b;color:#fff;text-align:center;margin:0;font-family:Arial}#b{width:320px;height:320px;margin:10px auto;display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #fff}.s{font-size:28px;display:flex;align-items:center;justify-content:center}.w{background:#f0d9b5}.bl{background:#b58863}.sel{background:#ff0!important}.wp{color:#fff;text-shadow:1px 1px 2px #000}.bp{color:#000}button{background:#81b64c;color:#fff;border:0;padding:8px 12px;border-radius:6px;margin:3px;font-weight:bold}input{padding:6px;width:60%;border-radius:6px;border:1px solid #555;background:#3a3937;color:#fff}</style></head><body><h3>♟️ ابن مصر - أونلاين</h3><div id="st" style="background:#262421;max-width:320px;margin:5px auto;padding:6px;border-radius:6px;font-size:12px">دور الأبيض</div><div id="b"></div><div style="max-width:320px;margin:8px auto;background:#262421;padding:6px;border-radius:6px"><div id="myId" style="font-size:10px;color:#aaa">تجهيز...</div><button onclick="createOnline()">🌍 هات لينك لصاحبك</button><br><input id="code" placeholder="كود صاحبك"><button onclick="joinOnline()">انضم</button><div id="share" style="font-size:11px;word-break:break-all;color:#8f8;margin-top:4px"></div></div><button onclick="location.reload()">لعبة جديدة</button><script>
let B=[["r","n","b","q","k","b","n","r"],["p","p","p","p","p","p","p","p"],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["P","P","P","P","P","P","P","P"],["R","N","B","Q","K","B","N","R"]],sel=null,turn="w",peer,conn,myColor="white",isOnline=false;
let M={K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
function draw(){let d=document.getElementById('b');d.innerHTML="";for(let r=0;r<8;r++)for(let c=0;c<8;c++){let rr=isOnline&&myColor=="black"?7-r:r,cc=isOnline&&myColor=="black"?7-c:c;let s=document.createElement('div');s.className="s "+((rr+cc)%2==0?"w":"bl");if(sel&&sel.r==rr&&sel.c==cc)s.classList.add('sel');let p=B[rr][cc];if(p){let e=document.createElement('span');e.textContent=M[p];e.className=p==p.toUpperCase()?"wp":"bp";s.appendChild(e);}s.onclick=()=>click(rr,cc);d.appendChild(s);}document.getElementById('st').innerText=isOnline?`أونلاين - أنت ${myColor=="white"?"الأبيض":"الأسود"} - دور ${turn=="w"?"الأبيض":"الأسود"}`:`دور ${turn=="w"?"الأبيض":"الأسود"}`;}
function click(r,c){if(isOnline){let myTurn=(turn=="w"&&myColor=="white")||(turn=="b"&&myColor=="black");if(!myTurn)return;}if(sel){let ok=true;if(B[r][c]!=""){if((B[r][c].toUpperCase()==B[r][c])==(B[sel.r][sel.c].toUpperCase()==B[sel.r][sel.c])) ok=false;}if(ok){B[r][c]=B[sel.r][sel.c];B[sel.r][sel.c]="";turn=turn=="w"?"b":"w";if(conn)conn.send({B,turn});}sel=null;draw();}else{if(B[r][c]&&((turn=="w"&&B[r][c]==B[r][c].toUpperCase())||(turn=="b"&&B[r][c]!=B[r][c].toUpperCase()))){if(isOnline&&((myColor=="white"&&B[r][c]!=B[r][c].toUpperCase())||(myColor=="black"&&B[r][c]==B[r][c].toUpperCase())))return;sel={r,c};draw();}}}
let p=new Peer();p.on('open',id=>{document.getElementById('myId').innerHTML=`كودك: <b style="color:#81b64c">${id}</b>`;let h=location.hash.replace("#","");if(h){document.getElementById('code').value=h;setTimeout(joinOnline,500);}});p.on('connection',c=>{conn=c;isOnline=true;myColor="white";conn.on('open',()=>draw());conn.on('data',d=>{B=d.B;turn=d.turn;draw();});document.getElementById('share').innerHTML="✅ صاحبك دخل!";});
window.createOnline=function(){let id=p.id;let link=`https://zlapeawbs22-source.github.io/ibn-masr-chess/#${id}`;document.getElementById('share').innerHTML=`ابعت اللينك ده:<br><b style="user-select:all">${link}</b>`;isOnline=true;myColor="white";try{navigator.clipboard.writeText(link);}catch(e){}};
window.joinOnline=function(){let rid=document.getElementById('code').value.trim()||location.hash.replace("#","");if(!rid)return alert("حط الكود");conn=p.connect(rid);myColor="black";isOnline=true;conn.on('open',()=>{document.getElementById('share').innerHTML="✅ انضميت";draw();});conn.on('data',d=>{B=d.B;turn=d.turn;draw();});};
draw();
</script></body></html>

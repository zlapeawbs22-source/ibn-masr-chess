
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>ابن مصر للشطرنج</title><style>body{background:#1a1a1a;color:#fac815;text-align:center;font-family:Tahoma;margin:0;padding:20px}h1{font-size:36px}#board{width:320px;height:320px;margin:20px auto;border:4px solid #fac815;display:grid;grid-template-columns:repeat(8,1fr)}.sq{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:26px}.w{background:#f0d9b5;color:#000}.b{background:#b58863;color:#000}</style></head><body><h1>ابن مصر للشطرنج ♟️</h1><div id="board"></div><p>الموقع اشتغل بنجاح!</p><script>const b=document.getElementById('board');let p=['♜','♞','♝','♛','♚','♝','♞','♜'];for(let r=0;r<8;r++){for(let c=0;c<8;c++){let d=document.createElement('div');d.className='sq '+((r+c)%2==0?'w':'b');if(r==0)d.textContent=p[c];if(r==1)d.textContent='♟';if(r==6)d.textContent='♙';if(r==7)d.textContent=p[c];b.appendChild(d)}} </script></body></html>

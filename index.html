<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ابن مصر - واضح</title>
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo';background:#161512;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{margin:8px}
.layout{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:960px}
.card{background:#262421;padding:10px;border-radius:6px;width:min(94vw,480px)}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(94vw,480px);height:min(94vw,480px);aspect-ratio:1;border-radius:4px;overflow:hidden}
.cell{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.light{background:#f0d9b5}.dark{background:#b58863}
.cell img{width:88%;height:88%;object-fit:contain;pointer-events:none}
.sel{background:#cdd26b!important}
.dot::after{content:'';width:28%;height:28%;background:rgba(0,0,0,.25);border-radius:50%;position:absolute}
.cap{box-shadow:inset 0 0 0 4px rgba(0,0,0,.4)!important}
#status{background:#262421;padding:8px;text-align:center;border-radius:6px;margin-bottom:8px;color:#bababa}
button{background:#3d3a37;color:#fff;border:none;padding:10px 16px;border-radius:4px;font-family:'Cairo';cursor:pointer}
button.primary{background:#81b64c;color:#fff}
input{width:100%;padding:9px;border-radius:4px;border:1px solid #3d3a37;background:#161512;color:#fff;text-align:center;direction:ltr}
.link-box{background:#161512;color:#81b64c;padding:6px;border-radius:4px;margin-top:6px;font-size:12px;direction:ltr;word-break:break-all}
#chatCard{width:min(94vw,360px);display:flex;flex-direction:column;height:min(94vw,480px)}
#chatMessages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:6px;background:#161512;border-radius:4px;margin:8px 0}
.msg{padding:7px 10px;border-radius:8px;max-width:80%;font-size:13px}
.msg.me{align-self:flex-end;background:#81b64c;color:#fff}.msg.them{align-self:flex-start;background:#3d3a37}.msg.system{align-self:center;color:#777;font-size:11px}
</style></head><body>
<h1>♟️ ابن مصر للشطرنج</h1>
<div class="layout">
<div style="display:flex;flex-direction:column;align-items:center">
<div class="card"><div id="setup" style="display:flex;flex-direction:column;gap:6px"><button class="primary" onclick="createRoom()">إنشاء غرفة أونلاين</button><div style="display:flex;gap:6px"><input id="joinInput" placeholder="كود الغرفة"><button onclick="joinRoom()">دخول</button></div></div><div id="roomInfo" style="display:none"><div id="shareLink" class="link-box"></div><div style="display:flex;gap:6px;margin-top:6px"><button onclick="copyLink()" style="flex:1">نسخ</button><button onclick="location.href=location.pathname" style="flex:1">خروج</button></div><div id="peerStatus" style="color:#81b64c;font-size:13px;margin-top:4px">مستني صاحبك...</div></div></div><div id="status">دور الأبيض</div><div id="board"></div><div style="display:flex;gap:6px;margin-top:8px"><button onclick="newGame(true)" class="primary">لعبة جديدة</button><button onclick="flipBoard()">قلب</button><button onclick="undoMove()">تراجع</button></div></div>
<div class="card" id="chatCard"><div>💬 الدردشة</div><div id="chatMessages"><div class="msg system">اكتب لصاحبك هنا</div></div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="اكتب..." onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">إرسال</button></div></div></div>
<script>
const pieceURL={K:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wK.svg',Q:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wQ.svg',R:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wR.svg',B:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wB.svg',N:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wN.svg',P:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wP.svg',k:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bK.svg',q:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bQ.svg',r:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bR.svg',b:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bB.svg',n:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bN.svg',p:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bP.svg'};
let board,turn='w',sel=null,moves=[],hist=[],flipped=false,myColor='w',peer=null,conn=null,roomId=null;
function initBoard(){return[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];}
function newGame(b){board=initBoard();turn='w';sel=null;moves=[];hist=[];render();if(b&&conn&&conn.open)conn.send({type:'sync',board,turn,hist});}
function isWhite(c){return c&&c===c.toUpperCase()&&c!==''}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function getMoves(r,c){const p=board[r][c];if(!p)return[];const m=[];const w=isWhite(p);const dir=w?-1:1;const add=(rr,cc)=>{if(!inside(rr,cc))return false;const t=board[rr][cc];if(t===''){m.push([rr,cc]);return true;}else{if(isWhite(t)!==w)m.push([rr,cc]);return false;}};const low=p.toLowerCase();if(low==='p'){if(board[r+dir]?.[c]===''){m.push([r+dir,c]);if((w&&r===6||!w&&r===1)&&board[r+2*dir][c]==='')m.push([r+2*dir,c]);}for(let dc of[-1,1]){let rr=r+dir,cc=c+dc;if(inside(rr,cc)&&board[rr][cc]!==''&&isWhite(board[rr][cc])!==w)m.push([rr,cc]);}}else if(low==='r'||low==='q'){for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break;}}if(low!=='q')return m;}if(low==='b'||low==='q'){for(let[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break;}}if(low==='b')return m;}if(low==='n'){for(let[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc);}if(low==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);}return m;}
function render(){const b=document.getElementById('board');b.innerHTML='';for(let r=0;r<8;r++){for(let c=0;c<8;c++){let rr=flipped?7-r:r,cc=flipped?7-c:c;const cell=document.createElement('div');cell.className='cell '+((rr+cc)%2===0?'light':'dark');const piece=board[rr][cc];if(piece){let img=document.createElement('img');img.src=pieceURL[piece];cell.appendChild(img);}if(sel&&sel[0]===rr&&sel[1]===cc)cell.classList.add('sel');if(moves.some(([mr,mc])=>mr===rr&&mc===cc)){if(board[rr][cc]==='')cell.classList.add('dot');else cell.classList.add('cap');}cell.onclick=()=>clickCell(rr,cc);b.appendChild(cell);}}document.getElementById('status').textContent=`${turn==='w'?'دور الأبيض':'دور الأسود'}`;}
function clickCell(r,c){if(sel){if(moves.some(([mr,mc])=>mr===r&&mc===c)){hist.push(JSON.parse(JSON.stringify({board:board.map(x=>[...x]),turn})));board[r][c]=board[sel[0]][sel[1]];board[sel[0]][sel[1]]='';if(board[r][c].toLowerCase()==='p'&&(r===0||r===7))board[r][c]=isWhite(board[r][c])?'Q':'q';turn=turn==='w'?'b':'w';sel=null;moves=[];render();if(conn&&conn.open)conn.send({type:'sync',board,turn,hist});return;}else{sel=null;moves=[];}}const p=board[r][c];if(p!==''&&((turn==='w'&&isWhite(p))||(turn==='b'&&!isWhite(p)))){sel=[r,c];moves=getMoves(r,c);}render();}
function flipBoard(){flipped=!flipped;render();}function undoMove(){if(hist.length){let prev=hist.pop();board=prev.board.map(x=>[...x]);turn=prev.turn;render();if(conn&&conn.open)conn.send({type:'sync',board,turn,hist});}}
function addMsg(t,w){const box=document.getElementById('chatMessages');const d=document.createElement('div');d.className='msg '+(w==='me'?'me':w==='them'?'them':'system');d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight;}function sendChat(){const inp=document.getElementById('chatInput');let t=inp.value.trim();if(!t)return;addMsg(t,'me');inp.value='';if(conn&&conn.open)conn.send({type:'chat',text:t});}
function createRoom(){roomId='ibn-masr-'+Math.random().toString(36).substr(2,6);myColor='w';peer=new Peer(roomId);peer.on('open',()=>{document.getElementById('setup').style.display='none';document.getElementById('roomInfo').style.display='block';let link=location.origin+location.pathname+'?join='+roomId;document.getElementById('shareLink').textContent=link;});peer.on('connection',c=>{conn=c;setupConn();});}
function joinRoom(){let id=document.getElementById('joinInput').value.trim()||new URLSearchParams(location.search).get('join');if(!id){alert('الصق الكود');return;}roomId=id;myColor='b';flipped=true;peer=new Peer();peer.on('open',()=>{conn=peer.connect(roomId);conn.on('open',()=>{document.getElementById('setup').style.display='none';document.getElementById('roomInfo').style.display='block';document.getElementById('shareLink').textContent='متصل!';setupConn();});});}
function setupConn(){conn.on('data',d=>{if(d.type==='sync'){board=d.board.map(x=>[...x]);turn=d.turn;hist=d.hist||[];sel=null;moves=[];render();}else if(d.type==='chat'){addMsg(d.text,'them');}});conn.on('open',()=>{document.getElementById('peerStatus').textContent='✅ صاحبك دخل!';conn.send({type:'sync',board,turn,hist});});}
function copyLink(){navigator.clipboard.writeText(document.getElementById('shareLink').textContent);alert('تم النسخ!');}
board=initBoard();render();let params=new URLSearchParams(location.search);if(params.get('join')){document.getElementById('joinInput').value=params.get('join');joinRoom();}
</script></body></html>


<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ابن مصر - واضح</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo';background:#161512;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px}h1{margin:8px}.lay{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:980px}.card{background:#262421;padding:8px;border-radius:8px;width:min(95vw,500px)}#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(95vw,500px);height:min(95vw,500px);border-radius:6px;overflow:hidden;box-shadow:0 0 15px #000}.cell{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}.light{background:#f0d9b5}.dark{background:#b58863}.cell img{width:84%;height:84%;object-fit:contain;pointer-events:none}.sel{background:#cdd26b!important}.dot::after{content:'';width:28%;height:28%;background:rgba(0,0,0,.3);border-radius:50%;position:absolute}.cap{box-shadow:inset 0 0 0 5px rgba(0,0,0,.5)!important}#status{background:#262421;padding:8px;text-align:center;border-radius:6px;margin-bottom:6px;font-weight:700}button{background:#3d3a37;color:#fff;border:none;padding:10px 14px;border-radius:6px;font-family:'Cairo';font-weight:700;cursor:pointer}button.p{background:#81b64c}input{width:100%;padding:9px;border-radius:6px;border:1px solid #444;background:#161512;color:#fff;text-align:center;direction:ltr}.link{word-break:break-all;background:#161512;color:#81b64c;padding:6px;border-radius:6px;margin-top:6px;font-size:11px;direction:ltr}#chat{width:min(95vw,360px);display:flex;flex-direction:column;height:min(95vw,500px)}#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;background:#161512;border-radius:6px;margin:6px 0}.m{padding:6px 10px;border-radius:10px;max-width:80%;font-size:13px}.me{align-self:flex-end;background:#81b64c}.them{align-self:flex-start;background:#3d3a37}.sys{align-self:center;color:#777;font-size:11px}</style></head><body><h1>♟️ ابن مصر</h1><div class="lay"><div style="display:flex;flex-direction:column;align-items:center"><div class="card"><div id="setup" style="display:flex;flex-direction:column;gap:6px"><button class="p" onclick="createRoom()">🔥 إنشاء غرفة</button><div style="display:flex;gap:6px"><input id="joinInput" placeholder="كود الغرفة"><button onclick="joinRoom()">دخول</button></div></div><div id="roomInfo" style="display:none"><div id="shareLink" class="link"></div><div style="display:flex;gap:6px;margin-top:6px"><button onclick="copyLink()" style="flex:1">نسخ اللينك</button><button onclick="location.href=location.pathname" style="flex:1">خروج</button></div><div id="peerStatus" style="color:#81b64c;font-size:12px;margin-top:4px">مستني صاحبك...</div></div></div><div id="status">دور الأبيض</div><div id="board"></div><div style="display:flex;gap:6px;margin-top:6px"><button class="p" onclick="newGame(1)">جديد</button><button onclick="flipBoard()">قلب</button><button onclick="undoMove()">تراجع</button></div></div><div class="card" id="chat"><div style="font-weight:800">💬 الشات</div><div id="msgs"><div class="m sys">اكتب لصاحبك</div></div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="رسالة..." onkeydown="if(event.key==='Enter')sendChat()"><button class="p" onclick="sendChat()">إرسال</button></div></div></div><script>const U={K:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wK.svg',Q:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wQ.svg',R:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wR.svg',B:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wB.svg',N:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wN.svg',P:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/wP.svg',k:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bK.svg',q:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bQ.svg',r:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bR.svg',b:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bB.svg',n:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bN.svg',p:'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/alpha/bP.svg'};let board,turn='w',sel=null,moves=[],hist=[],flip=false,peer=null,conn=null;function init(){return[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']]}function newGame(b){board=init();turn='w';sel=null;moves=[];hist=[];render();if(b&&conn&&conn.open)conn.send({type:'s',board,turn,hist})}function isW(c){return c&&c==c.toUpperCase()&&c!=''}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}function getMoves(r,c){let p=board[r][c];if(!p)return[];let m=[],w=isW(p),dir=w?-1:1;let add=(rr,cc)=>{if(!inside(rr,cc))return 0;let t=board[rr][cc];if(t==''){m.push([rr,cc]);return 1}if(isW(t)!=w){m.push([rr,cc]);return 0}return 0};let L=p.toLowerCase();if(L=='p'){if(board[r+dir]?.[c]==''){m.push([r+dir,c]);if((w&&r==6||!w&&r==1)&&board[r+2*dir][c]=='')m.push([r+2*dir,c])}for(let dc of[-1,1]){let rr=r+dir,cc=c+dc;if(inside(rr,cc)&&board[rr][cc]!=''&&isW(board[rr][cc])!=w)m.push([rr,cc])}}else if(L=='r'||L=='q'){for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break}}if(L!='q')return m}if(L=='b'||L=='q'){for(let[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break}}if(L=='b')return m}if(L=='n'){for(let[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc)}if(L=='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc)}return m}function render(){let b=document.getElementById('board');b.innerHTML='';for(let r=0;r<8;r++){for(let c=0;c<8;c++){let rr=flip?7-r:r,cc=flip?7-c:c;let cell=document.createElement('div');cell.className='cell '+((rr+cc)%2==0?'light':'dark');let pc=board[rr][cc];if(pc){let img=document.createElement('img');img.src=U[pc];cell.appendChild(img)}if(sel&&sel[0]==rr&&sel[1]==cc)cell.classList.add('sel');if(moves.some(([a,b])=>a==rr&&b==cc)){if(board[rr][cc]=='')cell.classList.add('dot');else cell.classList.add('cap')}cell.onclick=()=>clickCell(rr,cc);b.appendChild(cell)}}document.getElementById('status').textContent=turn=='w'?'دور الأبيض ⚪':'دور الأسود ⚫'}function clickCell(r,c){if(sel){if(moves.some(([a,b])=>a==r&&b==c)){hist.push({board:board.map(x=>[...x]),turn});board[r][c]=board[sel[0]][sel[1]];board[sel[0]][sel[1]]='';if(board[r][c].toLowerCase()=='p'&&(r==0||r==7))board[r][c]=isW(board[r][c])?'Q':'q';turn=turn=='w'?'b':'w';sel=null;moves=[];render();if(conn&&conn.open)conn.send({type:'s',board,turn,hist});return}sel=null;moves=[]}let p=board[r][c];if(p!=''&&((turn=='w'&&isW(p))||(turn=='b'&&!isW(p)))){sel=[r,c];moves=getMoves(r,c)}render()}function flipBoard(){flip=!flip;render()}function undoMove(){if(hist.length){let pr=hist.pop();board=pr.board.map(x=>[...x]);turn=pr.turn;render();if(conn&&conn.open)conn.send({type:'s',board,turn,hist})}}function addMsg(t,w){let box=document.getElementById('msgs');let d=document.createElement('div');d.className='m '+(w=='me'?'me':w=='them'?'them':'sys');d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}function sendChat(){let inp=document.getElementById('chatInput');let t=inp.value.trim();if(!t)return;addMsg(t,'me');inp.value='';if(conn&&conn.open)conn.send({type:'c',text:t})}function createRoom(){let id='ibn-masr-'+Math.random().toString(36).substr(2,6);peer=new Peer(id);peer.on('open',()=>{document.getElementById('setup').style.display='none';document.getElementById('roomInfo').style.display='block';let link=location.origin+location.pathname+'?join='+id;document.getElementById('shareLink').textContent=link});peer.on('connection',c=>{conn=c;setup()})}function joinRoom(){let id=document.getElementById('joinInput').value.trim()||new URLSearchParams(location.search).get('join');if(!id){alert('حط الكود');return}flip=true;peer=new Peer();peer.on('open',()=>{conn=peer.connect(id);conn.on('open',()=>{document.getElementById('setup').style.display='none';document.getElementById('roomInfo').style.display='block';document.getElementById('shareLink').textContent='متصل!';setup()})})}function setup(){conn.on('data',d=>{if(d.type=='s'){board=d.board.map(x=>[...x]);turn=d.turn;hist=d.hist||[];sel=null;moves=[];render()}else if(d.type=='c'){addMsg(d.text,'them')}});conn.on('open',()=>{document.getElementById('peerStatus').textContent='✅ صاحبك دخل!';conn.send({type:'s',board,turn,hist})})}function copyLink(){navigator.clipboard.writeText(document.getElementById('shareLink').textContent);alert('تم النسخ!')}board=init();render();let p=new URLSearchParams(location.search);if(p.get('join')){document.getElementById('joinInput').value=p.get('join');joinRoom()}</script></body></html>

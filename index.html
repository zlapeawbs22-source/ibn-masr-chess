<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ابن مصر للشطرنج - عالمي</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo',Tahoma;background:#161512;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}h1{color:#fff;font-weight:800;font-size:24px;margin:8px} .layout{display:flex;gap:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%;max-width:950px} .card{background:#262421;border:1px solid #3d3a37;padding:12px;border-radius:8px;width:min(94vw,460px)} #board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(92vw,480px);height:min(92vw,480px);aspect-ratio:1/1;border-radius:4px;overflow:hidden;box-shadow:0 0 15px rgba(0,0,0,.6)} .cell{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;line-height:1;user-select:none;position:relative;cursor:pointer} /* نفس الوان الصورة بالظبط */ .light{background:#f0d9b5} .dark{background:#b58863} /* القطع زي الصورة */ .white-piece{color:#ffffff !important;-webkit-text-stroke:1.8px #000000;text-stroke:1.8px #000000;paint-order:stroke fill;font-weight:900;filter:drop-shadow(0 1px 0 #000)} .black-piece{color:#000000 !important;-webkit-text-stroke:0.4px #000;text-stroke:0.4px #000;font-weight:900} .sel{background:#cdd26b !important} .dot::after{content:'';width:28%;height:28%;background:rgba(0,0,0,.18);border-radius:50%;position:absolute} .cap{box-shadow:inset 0 0 0 4px rgba(0,0,0,.4) !important} #status{background:#262421;border:1px solid #3d3a37;padding:8px 16px;border-radius:6px;font-weight:700;margin-bottom:8px;color:#bababa} button{background:#3d3a37;color:#bababa;border:none;padding:10px 16px;border-radius:4px;font-family:'Cairo';font-weight:700;cursor:pointer} button.primary{background:#81b64c;color:#fff} button.primary:hover{background:#8bc34a} input{width:100%;padding:10px;border-radius:4px;border:1px solid #3d3a37;background:#161512;color:#fff;font-family:'Cairo';direction:ltr;text-align:center} .link-box{background:#161512;color:#81b64c;padding:8px;border-radius:4px;margin-top:6px;font-size:12px;direction:ltr;word-break:break-all} #chatCard{width:min(94vw,360px);display:flex;flex-direction:column;height:min(92vw,480px)} #chatMessages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px;background:#161512;border-radius:4px;margin:8px 0;border:1px solid #3d3a37} .msg{padding:8px 12px;border-radius:8px;max-width:80%;font-size:13px} .msg.me{align-self:flex-end;background:#81b64c;color:#fff} .msg.them{align-self:flex-start;background:#3d3a37;color:#fff} .msg.system{align-self:center;color:#888;font-size:11px} #chatInputRow{display:flex;gap:6px} .coords{font-size:11px;color:#3d3a37;position:absolute;bottom:2px;right:4px;font-weight:700} .coords.light-coord{color:#b58863} .coords.dark-coord{color:#f0d9b5}</style></head><body><h1>♟️ ابن مصر للشطرنج</h1><div class="layout"><div style="display:flex;flex-direction:column;align-items:center"><div class="card" id="onlineCard"><div id="setup" style="display:flex;flex-direction:column;gap:8px"><button class="primary" onclick="createRoom()">إنشاء غرفة أونلاين</button><div style="display:flex;gap:6px"><input id="joinInput" placeholder="كود الغرفة"><button onclick="joinRoom()">دخول</button></div></div><div id="roomInfo" style="display:none"><div id="shareLink" class="link-box"></div><div style="display:flex;gap:6px;margin-top:6px"><button onclick="copyLink()" style="flex:1">نسخ اللينك</button><button onclick="location.href=location.pathname" style="flex:1">خروج</button></div><div id="peerStatus" style="margin-top:6px;color:#81b64c;font-weight:700;font-size:13px">مستني صاحبك...</div></div></div><div id="status">دور الأبيض</div><div id="board"></div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="newGame(true)" class="primary">لعبة جديدة</button><button onclick="flipBoard()">قلب الرقعة</button><button onclick="undoMove()">تراجع</button></div></div><div class="card" id="chatCard"><div style="font-weight:800;color:#bababa">💬 الدردشة</div><div id="chatMessages"><div class="msg system">مرحبا! اكتب لصاحبك هنا</div></div><div id="chatInputRow"><input id="chatInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">إرسال</button></div></div></div><script>
const P={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};let board,turn='w',sel=null,moves=[],hist=[],flipped=false,myColor='w',isOnline=false,peer=null,conn=null,roomId=null;const files=['a','b','c','d','e','f','g','h'];
function initBoard(){return[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];}
function newGame(b){board=initBoard();turn='w';sel=null;moves=[];hist=[];render();addSysMsg('بدأت لعبة جديدة');if(b&&conn&&conn.open)conn.send({type:'sync',board,turn,hist});}
function isWhite(c){return c&&c===c.toUpperCase()&&c!==''}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function getMoves(r,c){const p=board[r][c];if(!p)return[];const m=[];const w=isWhite(p);const dir=w?-1:1;const add=(rr,cc)=>{if(!inside(rr,cc))return false;const t=board[rr][cc];if(t===''){m.push([rr,cc]);return true;}else{if(isWhite(t)!==w)m.push([rr,cc]);return false;}};const low=p.toLowerCase();if(low==='p'){if(board[r+dir]?.[c]===''){m.push([r+dir,c]);if((w&&r===6||!w&&r===1)&&board[r+2*dir][c]==='')m.push([r+2*dir,c]);}for(let dc of[-1,1]){let rr=r+dir,cc=c+dc;if(inside(rr,cc)&&board[rr][cc]!==''&&isWhite(board[rr][cc])!==w)m.push([rr,cc]);}}else if(low==='r'||low==='q'){for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break;}}if(low!=='q')return m;}if(low==='b'||low==='q'){for(let[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break;}}if(low==='b')return m;}if(low==='n'){for(let[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc);}if(low==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);}return m;}
function render(){const b=document.getElementById('board');b.innerHTML='';for(let r=0;r<8;r++){for(let c=0;c<8;c++){let rr=flipped?7-r:r,cc=flipped?7-c:c;const cell=document.createElement('div');cell.className='cell '+((rr+cc)%2===0?'light':'dark');const piece=board[rr][cc];cell.textContent=piece?P[piece]:'';if(piece)cell.classList.add(isWhite(piece)?'white-piece':'black-piece');if(sel&&sel[0]===rr&&sel[1]===cc)cell.classList.add('sel');if(moves.some(([mr,mc])=>mr===rr&&mc===cc)){if(board[rr][cc]==='')cell.classList.add('dot');else cell.classList.add('cap');}cell.onclick=()=>clickCell(rr,cc);b.appendChild(cell);}}document.getElementById('status').textContent=isOnline?`انت ${myColor==='w'?'أبيض ⚪':'أسود ⚫'} | ${turn==='w'?'دور الأبيض':'دور الأسود'}`:`${turn==='w'?'دور الأبيض':'دور الأسود'}`;}
function clickCell(r,c){if(isOnline&&turn!==myColor)return;const p=board[r][c];if(sel){if(moves.some(([mr,mc])=>mr===r&&mc===c)){hist.push(JSON.parse(JSON.stringify({board:board.map(x=>[...x]),turn})));board[r][c]=board[sel[0]][sel[1]];board[sel[0]][sel[1]]='';if(board[r][c].toLowerCase()==='p'&&(r===0||r===7))board[r][c]=isWhite(board[r][c])?'Q':'q';turn=turn==='w'?'b':'w';sel=null;moves=[];render();if(conn&&conn.open)conn.send({type:'sync',board,turn,hist});return;}else{sel=null;moves=[];}}if(p!==''&&((turn==='w'&&isWhite(p))||(turn==='b'&&!isWhite(p)))){if(isOnline&&((myColor==='w'&&!isWhite(p))||(myColor==='b'&&isWhite(p))))return;sel=[r,c];moves=getMoves(r,c);}render();}
function flipBoard(){flipped=!flipped;render();}function undoMove(){if(hist.length){let prev=hist.pop();board=prev.board.map(x=>[...x]);turn=prev.turn;render();if(conn&&conn.open)conn.send({type:'sync',board,turn,hist});}}
function addMsg(t,w){const box=document.getElementById('chatMessages');const d=document.createElement('div');d.className='msg '+(w==='me'?'me':w==='them'?'them':'system');d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight;}function addSysMsg(t){addMsg(t,'system');}function sendChat(){const inp=document.getElementById('chatInput');let t=inp.value.trim();if(!t)return;addMsg(t,'me');inp.value='';if(conn&&conn.open)conn.send({type:'chat',text:t});}
function createRoom(){roomId='ibn-masr-'+Math.random().toString(36).substr(2,6);myColor='w';peer=new Peer(roomId);peer.on('open',()=>showRoom());peer.on('connection',c=>{conn=c;setupConn();});}
function joinRoom(){let id=document.getElementById('joinInput').value.trim();if(!id){let u=new URLSearchParams(location.search);if(u.get('join'))id=u.get('join');}if(!id){alert('الصق كود الغرفة');return;}roomId=id;myColor='b';flipped=true;peer=new Peer();peer.on('open',()=>{conn=peer.connect(roomId);conn.on('open',()=>{isOnline=true;document.getElementById('setup').style.display='none';document.getElementById('roomInfo').style.display='block';document.getElementById('shareLink').textContent='متصل!';document.getElementById('peerStatus').textContent='✅ متصل! انت الأسود';addSysMsg('دخلت الغرفة - انت الأسود');setupConn();});});}
function showRoom(){isOnline=true;document.getElementById('setup').style.display='none';document.getElementById('roomInfo').style.display='block';let link=location.origin+location.pathname+'?join='+roomId;document.getElementById('shareLink').textContent=link;addSysMsg('انشأت غرفة - ابعت اللينك');}
function setupConn(){conn.on('data',d=>{if(d.type==='sync'){board=d.board.map(x=>[...x]);turn=d.turn;hist=d.hist||[];sel=null;moves=[];render();}else if(d.type==='chat'){addMsg(d.text,'them');}});conn.on('open',()=>{document.getElementById('peerStatus').textContent='✅ صاحبك دخل! انت الأبيض';addSysMsg('صاحبك دخل الغرفة!');conn.send({type:'sync',board,turn,hist});});}
function copyLink(){navigator.clipboard.writeText(document.getElementById('shareLink').textContent);alert('تم النسخ!');}
board=initBoard();render();let params=new URLSearchParams(location.search);if(params.get('join')){document.getElementById('joinInput').value=params.get('join');joinRoom();}
</script></body></html>

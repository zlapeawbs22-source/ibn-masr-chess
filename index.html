

<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ابن مصر للشطرنج</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;padding:10px}h1{color:#fbbf24}#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,480px);aspect-ratio:1;border:4px solid #fbbf24;border-radius:12px;overflow:hidden}.cell{display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;position:relative}.light{background:#f0d9b5}.dark{background:#b58863}.sel{outline:4px solid #fbbf24;outline-offset:-4px;z-index:2}.dot::after{content:'';width:22%;height:22%;background:#22c55e;border-radius:50%;position:absolute}.cap{box-shadow:inset 0 0 0 4px #ef4444}button{background:#1e293b;color:#fff;border:1px solid #334155;padding:8px 14px;border-radius:8px;margin:4px}button.primary{background:#fbbf24;color:#000;font-weight:bold}#status{margin:8px;background:#1e293b;padding:8px 16px;border-radius:20px}</style></head><body><h1>♟️ ابن مصر للشطرنج</h1><div id="status">الدور: الأبيض</div><div id="board"></div><div><button class="primary" onclick="newGame()">لعبة جديدة</button><button onclick="undo()">تراجع</button><button onclick="flip()">قلب الرقعة</button></div><script>const P={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};let board,turn='w',sel=null,moves=[],hist=[],flipped=false;function initBoard(){return[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];}function newGame(){board=initBoard();turn='w';sel=null;moves=[];hist=[];render();}function isWhite(c){return c&&c===c.toUpperCase()&&c!==''}function isBlack(c){return c&&c===c.toLowerCase()&&c!==''}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}function getMoves(r,c){const p=board[r][c];if(!p)return[];const m=[];const w=isWhite(p);const dir=w?-1:1;const add=(rr,cc)=>{if(!inside(rr,cc))return false;const t=board[rr][cc];if(t===''){m.push([rr,cc]);return true;}else{if(isWhite(t)!==w)m.push([rr,cc]);return false;}};const low=p.toLowerCase();if(low==='p'){if(board[r+dir]?.[c]===''){m.push([r+dir,c]);if((w&&r===6||!w&&r===1)&&board[r+2*dir][c]==='')m.push([r+2*dir,c]);}for(let dc of[-1,1]){let rr=r+dir,cc=c+dc;if(inside(rr,cc)&&board[rr][cc]!==''&&isWhite(board[rr][cc])!==w)m.push([rr,cc]);}}else if(low==='r'||low==='q'){for(let[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break;}}if(low!=='q')return m;}if(low==='b'||low==='q'){for(let[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){for(let k=1;k<8;k++){if(!add(r+dr*k,c+dc*k))break;}}if(low==='b')return m;}if(low==='n'){for(let[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc);}if(low==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);}return m;}function render(){const b=document.getElementById('board');b.innerHTML='';for(let r=0;r<8;r++){for(let c=0;c<8;c++){let rr=flipped?7-r:r,cc=flipped?7-c:c;const cell=document.createElement('div');cell.className='cell '+((rr+cc)%2===0?'light':'dark');const piece=board[rr][cc];cell.textContent=piece?P[piece]:'';if(sel&&sel[0]===rr&&sel[1]===cc)cell.classList.add('sel');if(moves.some(([mr,mc])=>mr===rr&&mc===cc)){if(board[rr][cc]==='')cell.classList.add('dot');else cell.classList.add('cap');}cell.onclick=()=>clickCell(rr,cc);b.appendChild(cell);}}document.getElementById('status').textContent=(turn==='w'?'الدور: الأبيض ⚪':'الدور: الأسود ⚫');}function clickCell(r,c){const p=board[r][c];if(sel){if(moves.some(([mr,mc])=>mr===r&&mc===c)){hist.push(JSON.parse(JSON.stringify(board)));board[r][c]=board[sel[0]][sel[1]];board[sel[0]][sel[1]]='';if(board[r][c].toLowerCase()==='p'&&(r===0||r===7))board[r][c]=isWhite(board[r][c])?'Q':'q';turn=turn==='w'?'b':'w';sel=null;moves=[];render();return;}else{sel=null;moves=[];}}if(p!==''&&((turn==='w'&&isWhite(p))||(turn==='b'&&isBlack(p)))){sel=[r,c];moves=getMoves(r,c);}render();}function undo(){if(hist.length){board=hist.pop();turn=turn==='w'?'b':'w';sel=null;moves=[];render();}}function flip(){flipped=!flipped;render();}newGame();</script></body></html>
